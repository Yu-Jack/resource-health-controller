# Default values for harvester-resource-health-controller.

replicaCount: 1

image:
  repository: rancher/harvester-resource-health-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "main-head"

# Number of workers processing the ComponentHealth workqueue.
threadiness: 10

# Hide the checks below this severity (Info, Warning or Error). Empty reports all of them.
minSeverity: ""

# HealthIgnoreRules shipped with the addon, e.g. to silence a known harmless check.
# They are labeled health.harvesterhci.io/source=default and managed by Helm; the rules
# created by users (source=user) are never touched.
defaultIgnoreRules: []
#  - name: ignore-example
#    componentHealth: harvester-controller-volume
#    checkKey: SomeReason
#    resources: []   # optional, the whole check is ignored when empty
#    reason: "known harmless"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
